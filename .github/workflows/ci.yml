name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install ruff black mypy
          pip install -r requirements.txt

      - name: Run ruff
        run: |
          cd backend
          ruff check app/ --output-format=github

      - name: Run black check
        run: |
          cd backend
          black --check app/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: redpen_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: redpen_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://redpen_test:test_password@localhost:5432/redpen_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-cd-pipeline-testing-minimum-32-characters-long
          # Storage (MinIO for tests)
          STORAGE_TYPE: minio
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test_minio_access
          MINIO_SECRET_KEY: test_minio_secret_key_123
          MINIO_SECURE: "False"
          MINIO_BUCKET_NAME: test-bucket
          # AI Service Keys (dummy values for CI/CD)
          OPENAI_API_KEY: sk-test-dummy-key-for-ci-cd-testing-only-not-real
          GOOGLE_API_KEY: AIzaTest-Dummy-Google-API-Key-For-CI-CD-Testing
          MISTRAL_API_KEY: test-dummy-mistral-key-for-ci-cd-pipeline
          # AI Model Configuration
          OPENAI_MODEL: gpt-4o-mini
          GEMINI_MODEL: gemini-1.5-flash
          MISTRAL_OCR_MODEL: pixtral-12b-2409
          # Celery (for tests)
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          # CORS
          CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
          # GDPR Defaults
          DEFAULT_RETENTION_SUBMISSIONS_DAYS: "730"
          DEFAULT_RETENTION_ARTIFACTS_DAYS: "365"
          DEFAULT_RETENTION_ML_DAYS: "365"
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API image
        run: |
          docker build -t redpen-api:${{ github.sha }} ./backend

      - name: Test Docker image
        run: |
          docker run --rm redpen-api:${{ github.sha }} python -c "import app; print('✅ Image OK')"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the build on security warnings

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"  # Only fail on critical/high

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
